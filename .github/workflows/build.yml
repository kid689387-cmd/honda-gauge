name: Build firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool==4.8.1

      - name: Build both display versions
        run: pio run -e st7789 -e ili9341

      - name: Make flashable files
        run: |
          mkdir -p out
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)
          for ENV in st7789 ili9341; do
            B=.pio/build/$ENV
            python -m esptool --chip esp32 merge_bin -o out/honda-gauge-$ENV-full.bin \
              --flash_mode dio --flash_freq 40m --flash_size 4MB \
              0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $BOOT_APP0 0x10000 $B/firmware.bin
            cp $B/firmware.bin out/honda-gauge-$ENV-ota.bin
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: honda-gauge-firmware
          path: out/*.bin

      - name: Publish as release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.bin --title "Latest build #${{ github.run_number }}" \
            --notes "full.bin = first flash over USB at address 0x0. ota.bin = WiFi update from the gauge's SET > WIFI UPDATE."
