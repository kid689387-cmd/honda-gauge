; Honda K-Line Smart Gauge for ESP32-2432S028 (CYD, 2.8" 240x320)
; Two builds: st7789 (most 2-USB boards) and ili9341 (older 1-USB boards).
; If colors look wrong on one, flash the other.

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    paulstoffregen/XPT2046_Touchscreen@1.4
build_flags =
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

[env:st7789]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_RGB
    -DPANEL_NAME=\"ST7789\"

[env:ili9341]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DPANEL_NAME=\"ILI9341\"
